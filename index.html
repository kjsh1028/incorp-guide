<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>법인 설립 가이드 생성기</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F5F7FA; --sheet:#FFFFFF; --ink:#14213D; --ink2:#4A5670; --line:#D3D9E2;
  --seal:#B3261E; --seal-bg:#FBEAE8; --ok:#1F6F5C; --ok-bg:#E3F1ED;
  --kr:#2C4A8A; --cn:#9A6B1F; --focus:#2C4A8A; --mute-bg:#EBEEF3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10141C; --sheet:#181E29; --ink:#E6EAF2; --ink2:#A3ADC0; --line:#2C3545;
    --seal:#F0857D; --seal-bg:#3A1C1A; --ok:#6FC7B0; --ok-bg:#16302A;
    --kr:#8FAEEB; --cn:#E0B160; --focus:#8FAEEB; --mute-bg:#222A38;
  }
}
:root[data-theme="dark"]{
  --paper:#10141C; --sheet:#181E29; --ink:#E6EAF2; --ink2:#A3ADC0; --line:#2C3545;
  --seal:#F0857D; --seal-bg:#3A1C1A; --ok:#6FC7B0; --ok-bg:#16302A;
  --kr:#8FAEEB; --cn:#E0B160; --focus:#8FAEEB; --mute-bg:#222A38;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
h1,h2,h3{font-family:"AppleMyungjo","Nanum Myeongjo","Noto Serif KR","Batang",serif;line-height:1.3;margin:0}
h1{font-size:1.6rem;font-weight:700}
h2{font-size:1.2rem;font-weight:700;margin-bottom:12px}
h3{font-size:1rem;font-weight:600}
p{margin:0}
.lede{color:var(--ink2);margin-top:6px;font-size:.95rem}
section{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:18px 16px;margin-top:16px}
.q{margin-top:16px}
.q:first-of-type{margin-top:0}
.q > label,.q > .lab{display:block;font-weight:600;margin-bottom:6px}
.hint{color:var(--ink2);font-size:.85rem;margin-top:4px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);
  border-radius:3px;padding:9px 12px;min-height:44px;cursor:pointer;text-align:left}
.opts button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.opts button:disabled{color:var(--ink2);background:var(--mute-bg);cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
input[type=number],input[type=text]{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);
  border-radius:3px;padding:9px 10px;min-height:44px;width:100%;max-width:280px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.echo{color:var(--ink2);font-size:.9rem}
.warn{background:var(--seal-bg);border-left:4px solid var(--seal);padding:10px 12px;margin-top:10px;font-size:.92rem;border-radius:2px}
.note{background:var(--mute-bg);padding:10px 12px;margin-top:10px;font-size:.92rem;border-radius:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:20px 0 0;padding-bottom:2px}
.tabs button{font:inherit;font-weight:600;color:var(--ink2);background:transparent;border:0;border-bottom:3px solid transparent;
  padding:10px 12px;min-height:44px;white-space:nowrap;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.panel{display:none}.panel.on{display:block}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.sum div{border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.sum b{display:block;font-size:1.15rem}
.sum span{color:var(--ink2);font-size:.85rem}
.phase{margin-top:22px}
.phase h3{border-bottom:1px solid var(--line);padding-bottom:6px}
.step{border-left:4px solid var(--kr);padding:8px 0 8px 12px;margin-top:10px}
.step.cn{border-left-color:var(--cn)}
.step .t{font-weight:600}
.meta{color:var(--ink2);font-size:.86rem;margin-top:2px}
.tag{display:inline-block;font-size:.76rem;font-weight:600;padding:1px 7px;border-radius:2px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.tag.chk{background:var(--seal-bg);color:var(--seal);border:1px solid var(--seal)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.cn{background:transparent;color:var(--cn);border:1px solid var(--cn)}
.tag.kr{background:transparent;color:var(--kr);border:1px solid var(--kr)}
.doc{border-top:1px solid var(--line);padding:12px 0}
.doc:first-of-type{border-top:0}
.kv{display:grid;grid-template-columns:5.2em 1fr;gap:2px 10px;font-size:.9rem;margin-top:6px}
.kv dt{color:var(--ink2)}.kv dd{margin:0}
ul.plain{margin:8px 0 0;padding-left:18px}
ul.plain li{margin-top:4px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
.scroll{overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:0}
.act{font:inherit;font-weight:600;background:var(--ink);color:var(--sheet);border:0;border-radius:3px;padding:10px 16px;min-height:44px;cursor:pointer;margin-top:14px}
.small{font-size:.85rem;color:var(--ink2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:.85rem;color:var(--ink2)}
.legend i{display:inline-block;width:4px;height:14px;vertical-align:-2px;margin-right:5px}
@media (max-width:420px){.sum{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>법인 설립 가이드 생성기</h1>
  <p class="lede">누가, 어디에, 무엇을 세우는지 고르고 기본 정보를 넣으면 절차, 서류, 기관, 비용 안내가 나옵니다.</p>
  <p class="small" id="data-msg" style="margin-top:4px">규칙 데이터를 읽는 중입니다.</p>

  <section aria-labelledby="h-track">
    <h2 id="h-track">1. 어떤 설립인가요</h2>
    <div class="q"><span class="lab">어디에 세우나요</span><div class="opts" id="o-where"></div></div>
    <div class="q"><span class="lab">무엇을 세우나요</span><div class="opts" id="o-what"></div></div>
    <div id="track-msg"></div>
  </section>

  <div id="guide" hidden>
  <section aria-labelledby="h-in">
    <h2 id="h-in">2. 기본 정보</h2>
    <details style="margin-bottom:16px"><summary style="cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center">고객 회신에서 읽은 값 불러오기</summary>
      <p class="hint">Claude가 자료요청서 회신을 읽어 만든 사건 데이터를 붙여넣으면 아래 항목이 채워집니다.</p>
      <textarea id="imp" rows="4" style="font:inherit;font-size:.85rem;width:100%;margin-top:8px;border:1px solid var(--line);border-radius:3px;padding:8px;background:var(--sheet);color:var(--ink)" placeholder="사건 데이터를 여기에 붙여넣으세요"></textarea>
      <button class="act" id="imp-go" type="button" style="margin-top:8px">항목 채우기</button>
      <div id="imp-msg"></div>
    </details>
    <div id="inputs"></div>
    <div id="warns"></div>
  </section>

  <div class="tabs" role="tablist" id="tabs"></div>
  <section id="out" aria-live="polite">
    <div class="panel on" id="p-proc"></div>
    <div class="panel" id="p-doc"></div>
    <div class="panel" id="p-ag"></div>
    <div class="panel" id="p-cost"></div>
    <div class="panel" id="p-chk"></div>
  </section>
  <button class="act" id="copy" type="button">안내 요약 복사</button>
  <p class="small" id="copy-msg" style="margin-top:6px"></p>
  </div>

  <p class="small" style="margin-top:24px">내부 검토용입니다. "확인필요" 표시가 있는 항목은 확정 전에 고객에게 그대로 안내하지 마세요. 입력한 값은 저장되지 않습니다.</p>
</div>

<!-- 파일을 직접 열 때(file://) 쓰는 규칙 데이터 묶음. tools/build_data.py 가 data/ 의 JSON으로 만든다. -->
<script src="data/bundle.js"></script>
<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function won(n){return Math.round(n).toLocaleString("ko-KR")+"원"}
function korAmt(n){if(!n||n<10000)return "";var eok=Math.floor(n/1e8),man=Math.round((n%1e8)/1e4);return (eok?eok+"억 ":"")+(man?man.toLocaleString("ko-KR")+"만 ":"")+"원"}

/* ---------- 조건식 계산 ----------
   data/ 의 when, applies, expr, formula 문자열을 계산한다.
   지원: 숫자, '문자열', true/false, 항목 키(TAX-1 같은 비용 ID 포함), [목록], in,
   ! - * / + < > <= >= == != && || ?: 괄호. 모르는 항목 키는 오류로 알린다. */
function lex(src){
 var t=[],i=0,m,r;
 while(i<src.length){
  r=src.slice(i);
  if((m=/^\s+/.exec(r))){i+=m[0].length;continue}
  if((m=/^\d+(\.\d+)?/.exec(r)))t.push({k:"v",v:Number(m[0])});
  else if((m=/^'([^']*)'/.exec(r)))t.push({k:"v",v:m[1]});
  else if((m=/^[A-Z][A-Z0-9]*(-\d+)+(?![A-Za-z0-9_])/.exec(r)))t.push({k:"id",v:m[0]});
  else if((m=/^[A-Za-z_][A-Za-z0-9_]*/.exec(r))){
   var w=m[0];t.push(w==="true"?{k:"v",v:true}:w==="false"?{k:"v",v:false}:w==="in"?{k:"op",v:"in"}:{k:"id",v:w});
  }
  else if((m=/^(==|!=|>=|<=|&&|\|\||[<>!?:*\/+\-()\[\],])/.exec(r)))t.push({k:"op",v:m[0]});
  else throw Error("조건식을 읽을 수 없습니다: "+src);
  i+=m[0].length;
 }
 return t;
}
function evalExpr(src,vars){
 var t=lex(String(src)),p=0;
 function is(v){return t[p]&&t[p].k==="op"&&t[p].v===v}
 function eat(v){if(!is(v))throw Error("조건식 오류 ("+v+" 필요): "+src);p++}
 function tern(){var c=or();if(is("?")){p++;var a=tern();eat(":");var b=tern();return c?a:b}return c}
 function or(){var a=and();while(is("||")){p++;var b=and();a=a||b}return a}
 function and(){var a=eq();while(is("&&")){p++;var b=eq();a=a&&b}return a}
 function eq(){var a=rel();while(is("==")||is("!=")){var o=t[p++].v,b=rel();a=o==="=="?a===b:a!==b}return a}
 function rel(){var a=add();while(is("<")||is(">")||is("<=")||is(">=")||is("in")){var o=t[p++].v,b=add();
  a=o==="in"?b.indexOf(a)>=0:o==="<"?a<b:o===">"?a>b:o==="<="?a<=b:a>=b}return a}
 function add(){var a=mul();while(is("+")||is("-")){var o=t[p++].v,b=mul();a=o==="+"?a+b:a-b}return a}
 function mul(){var a=un();while(is("*")||is("/")){var o=t[p++].v,b=un();a=o==="*"?a*b:a/b}return a}
 function un(){if(is("!")){p++;return !un()}if(is("-")){p++;return -un()}return prim()}
 function prim(){
  var k=t[p];if(!k)throw Error("조건식이 중간에 끝났습니다: "+src);
  if(is("(")){p++;var v=tern();eat(")");return v}
  if(is("[")){p++;var l=[];if(!is("]")){l.push(tern());while(is(",")){p++;l.push(tern())}}eat("]");return l}
  p++;
  if(k.k==="v")return k.v;
  if(k.k==="id"){if(!Object.prototype.hasOwnProperty.call(vars,k.v))throw Error("조건식에 모르는 항목이 있습니다: "+k.v+" ("+src+")");return vars[k.v]}
  throw Error("조건식 오류: "+src);
 }
 var res=tern();if(p<t.length)throw Error("조건식 끝부분 오류: "+src);return res;
}
function when(expr,vars){return !expr||expr==="always"?true:!!evalExpr(expr,vars)}

/* ---------- 데이터 읽기 ---------- */
var FILES=["inputs","rules","process","documents","agencies","costs"];
function getJSON(u){return fetch(u,{cache:"no-cache"}).then(function(r){if(!r.ok)throw Error(u+" ("+r.status+")");return r.json()})}
function fetchAll(){
 return getJSON("data/tracks.json").then(function(tr){
  var out={tracks:tr,data:{},from:"json"};
  return Promise.all(tr.tracks.filter(function(t){return t.ready}).map(function(t){
   return Promise.all(FILES.map(function(f){return getJSON("data/tracks/"+t.id+"/"+f+".json")})).then(function(a){
    var d={};FILES.forEach(function(f,i){d[f]=a[i]});out.data[t.id]=d;
   });
  })).then(function(){return out});
 });
}
function load(){
 function bundle(err){
  if(window.TRACK_DATA){var b=window.TRACK_DATA;b.from="bundle";return b}
  throw err||Error("data/bundle.js 가 없습니다");
 }
 if(/^https?:$/.test(location.protocol))return fetchAll().catch(bundle);
 return Promise.resolve().then(function(){return bundle()});
}

/* ---------- 상태 ---------- */
var D=null, T=null, TRACK=null, V={}, FEE={}, tab="proc";
var STATUS={confirmed:"확정",pilot:"시범 적용",practice:"내부 원칙",needs_check:"확인필요",rough:"대략치",needs_data:"자료 없음"};
function tagChk(){return '<span class="tag chk">확인필요</span>'}
function tagStatus(s){
 if(!s)return "";
 if(s==="needs_check")return tagChk();
 return '<span class="tag'+(s==="confirmed"?' ok':'')+'"'+(s==="confirmed"?'':' style="border:1px solid var(--line);color:var(--ink2)"')+'>'+esc(STATUS[s]||s)+'</span>';
}

/* ---------- 입력 ---------- */
function shownInputs(){return T.inputs.inputs.filter(function(i){return i.screen!==false})}
function optsOf(i){return i.options||(i.type==="boolean"?[{value:false,label:"아니오"},{value:true,label:"예"}]:[])}
function optLabel(i,v){var o=optsOf(i);for(var k=0;k<o.length;k++)if(o[k].value===v)return o[k].label;return v==null?"":String(v)}
function initValues(){
 V={};
 T.inputs.inputs.forEach(function(i){
  var o=optsOf(i);
  V[i.key]=i.default!==undefined?i.default:(o.length?o[0].value:(i.type==="number"?0:""));
 });
}
function buildInputs(){
 var h="";
 shownInputs().forEach(function(i){
  var id="in-"+i.key, hint=i.hint?'<p class="hint">'+esc(i.hint)+'</p>':'';
  if(optsOf(i).length){
   h+='<div class="q"><span class="lab">'+esc(i.label)+'</span><div class="opts" id="'+id+'"></div>'+hint+'</div>';
  }else{
   var num=i.type==="number";
   h+='<div class="q"><label for="'+id+'">'+esc(i.label)+'</label><div class="row"><input id="'+id+'" data-in="'+esc(i.key)+'" type="'+(num?'number':'text')+'"'+(num?' inputmode="numeric" min="0"':'')+' value="'+esc(V[i.key])+'"><span class="echo" id="echo-'+esc(i.key)+'"></span></div>'+hint+'</div>';
  }
 });
 $("inputs").innerHTML=h;
}
function paintInputs(){
 shownInputs().forEach(function(i){
  var el=$("in-"+i.key);
  if(optsOf(i).length){
   el.innerHTML=optsOf(i).map(function(o){
    return '<button type="button" data-in="'+esc(i.key)+'" data-v="'+esc(JSON.stringify(o.value))+'" aria-pressed="'+(V[i.key]===o.value)+'">'+esc(o.label)+'</button>';
   }).join("");
  }else if(/_krw$/.test(i.key)){
   $("echo-"+i.key).textContent=korAmt(Number(V[i.key])||0);
  }
 });
}
function ctx(){
 var c={};
 T.inputs.inputs.forEach(function(i){var v=V[i.key];if(i.type==="number")v=Math.max(0,Number(v)||0);c[i.key]=v});
 (T.inputs.derived||[]).forEach(function(d){c[d.key]=evalExpr(d.expr,c)});
 return c;
}

/* ---------- 계산 ---------- */
function plan(c){
 var on=T.process.steps.filter(function(s){return when(s.applies,c)}), ids={}, fin={};
 on.forEach(function(s){ids[s.id]=s});
 function f(id){
  if(fin[id])return fin[id];
  fin[id]=[0,0];
  var s=ids[id], st=[0,0];
  (s.prereq||[]).forEach(function(p){if(ids[p]){var x=f(p);st[0]=Math.max(st[0],x[0]);st[1]=Math.max(st[1],x[1])}});
  var d=s.days||[0,0];
  return (fin[id]=[st[0]+d[0],st[1]+d[1]]);
 }
 var tot=[0,0];
 on.forEach(function(s){var x=f(s.id);tot[0]=Math.max(tot[0],x[0]);tot[1]=Math.max(tot[1],x[1])});
 return {on:on,ids:ids,tot:tot,undated:on.filter(function(s){return !s.days})};
}
function rulesOn(c){return T.rules.rules.filter(function(r){return when(r.when,c)})}
function ruleById(id){var r=T.rules.rules;for(var i=0;i<r.length;i++)if(r[i].id===id)return r[i];return null}
/* 규칙의 effects 에서 문장으로만 있는 추가 서류(documents_extra)와 고객 주의사항(client_guide_dont)을 모은다. */
function effectsList(c,field){
 var out=[];
 function pick(e,rid){
  if(!e)return;
  (e[field]||[]).forEach(function(x){out.push({rule:rid,text:x})});
  Object.keys(e).forEach(function(k){if(k.indexOf("by_")===0){var br=e[k][String(c[k.slice(3)])];if(br)(br[field]||[]).forEach(function(x){out.push({rule:rid,text:x})})}});
 }
 rulesOn(c).forEach(function(r){
  pick(r.effects,r.id);
  if(r.effects&&r.effects.inherits){var p=ruleById(r.effects.inherits);if(p)pick(p.effects,r.id+" ("+p.id+")")}
 });
 return out;
}
function docsOn(c){return T.documents.documents.filter(function(d){return when(d.applies,c)})}
function agenciesOn(p){return T.agencies.agencies.filter(function(a){return (a.steps||[]).some(function(s){return p.ids[s]})})}
function taxes(c){
 var vars={},rows=[],sum=0;
 Object.keys(c).forEach(function(k){vars[k]=c[k]});
 T.costs.items.filter(function(i){return i.category==="tax"}).forEach(function(i){
  if(i.formula){var v=evalExpr(i.formula,vars);vars[i.id]=v;sum+=v;rows.push({item:i,amount:v})}
  else rows.push({item:i,amount:null});
 });
 return {rows:rows,sum:sum};
}
function warnings(c){
 var w=[];
 T.inputs.inputs.forEach(function(i){if(i.warn_if&&when(i.warn_if,c))w.push(i.warn_text)});
 (T.inputs.warnings||[]).forEach(function(x){if(when(x.when,c))w.push(x.text)});
 return w;
}

/* ---------- 렌더 ---------- */
function tracksAt(where){return D.tracks.tracks.filter(function(t){return t.where===where})}
function renderTrack(){
 var tr=null;D.tracks.tracks.forEach(function(t){if(t.id===TRACK)tr=t});
 $("o-where").innerHTML=D.tracks.where.map(function(w){return '<button type="button" data-where="'+esc(w.id)+'" aria-pressed="'+(tr&&tr.where===w.id)+'">'+esc(w.label)+'</button>'}).join("");
 $("o-what").innerHTML=tracksAt(tr?tr.where:"").map(function(t){return '<button type="button" data-track="'+esc(t.id)+'" aria-pressed="'+(t.id===TRACK)+'">'+esc(t.label)+'</button>'}).join("");
 $("guide").hidden=!T;
 $("track-msg").innerHTML=tr?(T?'<p class="note">'+esc(tr.note)+'</p>':'<p class="warn">'+esc(tr.note||"준비 중입니다.")+'</p>'):'';
}
function renderWarn(c){$("warns").innerHTML=warnings(c).map(function(x){return '<p class="warn">'+esc(x)+'</p>'}).join("")}
function renderProc(c,p){
 var P=T.process, ph={};
 P.phases.forEach(function(x){ph[x.id]=x});

function summary(){
 var c=ctx(), p=plan(c), t=taxes(c), L=[];
 L.push("["+T.inputs.title+" 안내 요약]");
 shownInputs().forEach(function(i){var v=V[i.key];if(v===""||v==null)return;L.push(i.label+": "+(i.type==="number"?(/_krw$/.test(i.key)?won(Number(v)||0):v):optLabel(i,v)))});
 L.push("");L.push("예상 기간: 약 "+p.tot[0]+"~"+p.tot[1]+"일"+(p.undated.length?" (기간 미정 단계 제외: "+p.undated.map(function(s){return s.task}).join(", ")+")":""));
 L.push("세금·공과금 합계: "+won(t.sum));
 L.push("");L.push("준비 서류:");
 docsOn(c).forEach(function(d){L.push("- "+d.name+" ("+(d.notarize?"공증+아포스티유":"공증 불요")+")"+(d.status==="needs_check"?" [확인필요]":""))});
 effectsList(c,"documents_extra").forEach(function(x){L.push("- "+x.text+" [확인필요]")});
 L.push("");L.push("확인필요:");
 rulesOn(c).filter(function(r){return r.status==="needs_check"}).forEach(function(r){L.push("- "+r.id+": "+r.text)});
 return L.join("\n");

/* ---------- 회신 값 불러오기 ----------
   docgen.py read 결과의 program_inputs(짧은 키: sh, cap ...)와 answers(긴 키)를 받는다.
   짧은 키·값은 inputs.json 의 import_key 와 alias 로 바꾼다. */
function matchOpt(o,v){
 var i,m;
 for(i=0;i<o.length;i++)if(o[i].value===v||(o[i].alias||[]).indexOf(v)>=0)return o[i].value;
 if(typeof v==="number"){
  for(i=0;i<o.length;i++)if(o[i].value===String(v))return o[i].value;
  for(i=0;i<o.length;i++)if((m=/^(\d+)plus$/.exec(o[i].value))&&v>=Number(m[1]))return o[i].value;
 }
 return undefined;
}
function importCase(j){
 var pi=j.program_inputs||j, ans=j.answers||{}, n=0, bad=[];
 T.inputs.inputs.forEach(function(i){
  var v;
  if(i.import_key&&pi[i.import_key]!=null)v=pi[i.import_key];
  else if(pi[i.key]!=null)v=pi[i.key];
  else if(ans[i.key]!=null)v=ans[i.key];
  else return;
  var o=optsOf(i);
  if(o.length){var hit=matchOpt(o,v);if(hit===undefined){bad.push(i.label+" ("+v+")");return}v=hit}
  else if(i.type==="number"){v=Number(v);if(!(v>=0)){bad.push(i.label);return}}
  else v=String(v);
  V[i.key]=v;n++;
  var el=$("in-"+i.key);if(el&&el.tagName==="INPUT")el.value=v;
 });
 return {n:n,bad:bad};
}

/* ---------- 이벤트 ---------- */
document.addEventListener("click",function(e){
 var b=e.target.closest("button");if(!b||!D)return;
 if(b.dataset.where){var ts=tracksAt(b.dataset.where);if(ts.length)selectTrack(ts[0].id)}
 else if(b.dataset.track)selectTrack(b.dataset.track);
 else if(b.dataset.in){V[b.dataset.in]=JSON.parse(b.dataset.v);render()}
 else if(b.dataset.tab){tab=b.dataset.tab;renderTabs()}
 else if(b.id==="imp-go"){
  var box=$("imp-msg");
  try{
   var j=JSON.parse($("imp").value), r=importCase(j);
   render();
   var rv=(j.review||[]).map(function(x){return "<li>"+esc(x)+"</li>"}).join("");
   box.innerHTML='<p class="note">'+r.n+'개 항목을 채웠습니다'+(j.client_name?' ('+esc(j.client_name)+')':'')+'. 아래 값을 눈으로 확인해 주세요.</p>'
    +(r.bad.length?'<p class="warn">선택지에 없는 값이라 채우지 않은 항목: '+esc(r.bad.join(", "))+'</p>':'')
    +(rv?'<div class="warn">직접 확인할 항목<ul class="plain">'+rv+'</ul></div>':'');
  }catch(err){box.innerHTML='<p class="warn">읽지 못했습니다. 사건 데이터 전체를 그대로 붙여넣었는지 확인해 주세요.</p>'}
 }
 else if(b.id==="copy"){
  var txt=summary(), msg=$("copy-msg");
  try{
   navigator.clipboard.writeText(txt).then(function(){msg.textContent="안내 요약을 복사했습니다."},function(){msg.textContent="복사하지 못했습니다. 브라우저에서 클립보드 권한을 허용해 주세요."});
  }catch(err){msg.textContent="복사하지 못했습니다. 이 화면에서는 클립보드를 쓸 수 없습니다."}
 }
});
document.addEventListener("input",function(e){
 var el=e.target;
 if(el.dataset&&el.dataset.fee){FEE[el.dataset.fee]=el.value;return}
 if(el.dataset&&el.dataset.in&&el.tagName==="INPUT"){V[el.dataset.in]=el.value;safe(function(){paintInputs();renderOut()})}
});
function fail(err){
 var m=document.createElement("p");m.className="warn";
 m.textContent="화면을 그리는 중 오류가 났습니다: "+(err&&err.message?err.message:err);
 document.querySelector(".wrap").appendChild(m);
}
function safe(f){try{f()}catch(err){fail(err)}}

load().then(function(data){
 D=data;
 var first=null;D.tracks.tracks.forEach(function(t){if(!first&&t.ready&&D.data[t.id])first=t.id});
 var k=first&&D.data[first].inputs;
 $("data-msg").textContent=k?"규칙 데이터: "+(k.source||"")+" / 갱신 "+(k.updated||"")+(D.from==="bundle"?" (묶음 파일에서 읽음)":""):"";
 safe(function(){selectTrack(first||D.tracks.tracks[0].id)});
},function(err){
 $("data-msg").textContent="";
 fail(Error("규칙 데이터를 읽지 못했습니다. "+(err&&err.message?err.message:err)));
});
})();
